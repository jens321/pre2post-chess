# C_total=6.5e18, alpha=1.000
# Model: ~50M (53.8M params)
# Architecture: n_layer=12, n_embed=512, n_head=8, kv_heads=8, head_dim=128, intermediate=1536
# Pretrain tokens: 22,954,911,000
# Estimated steps: ~525404

model:
  architecture: "Qwen/Qwen3-0.6B"
  block_size: 1024
  n_layer: 12
  n_head: 8
  num_key_value_heads: 4
  head_dim: 128
  n_embed: 512
  intermediate_size: 1536
  dropout: 0.0

training:
  device: "cuda"
  batch_size: 32
  gradient_accumulation_steps: 2
  epochs: 1
  experiment_name: "50m_C_6p5e18_alpha1.000"
  optimizer:
    name: adamw
    lr: 1e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
  scheduler:
    name: cosine
    eta_min: 1e-4
    warmup_ratio: 0.05
  max_grad_norm: 1.0
  log_interval: 10
  num_workers: 8
  save_dir: "checkpoints"

data:
  txt_path: "/data/pretrain_v1_54b"
  pretrain_tokens: 22954911000
  # Placeholder held-out eval shards -- replace with your own paths.
  # If none of them exist, the trainer warns and holds out the last
  # `eval_holdout` training shards instead.
  eval_txt_files:
    - "/data/eval/holdout_shard_00.npy"
    - "/data/eval/holdout_shard_01.npy"

tokenizer:
  name: "LanTokenizer"
  special_tokens: ["<bos>", "<eos>", "<pad>"]
  include_move_numbers: false
