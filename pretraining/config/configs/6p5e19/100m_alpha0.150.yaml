# C_total=6.5e19, alpha=0.150
# Model: ~100m
# Pretrain tokens: 14,244,975,333 (12419 shards, 12417 train + 2 eval)
# Estimated steps: ~434,722

model:
  architecture: "Qwen/Qwen3-0.6B"
  block_size: 1024
  n_layer: 12
  n_head: 12
  num_key_value_heads: 4
  head_dim: 128
  n_embed: 768
  intermediate_size: 2304
  dropout: 0.0

training:
  device: "cuda"
  batch_size: 32
  gradient_accumulation_steps: 2
  epochs: 1
  experiment_name: "100m_C_6p5e19_alpha0.150"
  optimizer:
    name: adamw
    lr: 1e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
  scheduler:
    name: cosine
    eta_min: 1e-4
    warmup_ratio: 0.05
  max_grad_norm: 1.0
  log_interval: 10
  num_workers: 8
  save_dir: "checkpoints"

data:
  txt_path: "/data/pretrain_v1_54b"
  pretrain_tokens: 14244975333
  # Placeholder held-out eval shards -- replace with your own paths.
  # If none of them exist, the trainer warns and holds out the last
  # `eval_holdout` training shards instead.
  eval_txt_files:
    - "/data/eval/holdout_shard_00.npy"
    - "/data/eval/holdout_shard_01.npy"

tokenizer:
  name: "LanTokenizer"
  special_tokens: ["<bos>", "<eos>", "<pad>"]
  include_move_numbers: false
